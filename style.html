<style>
:root {
  --dark: #0f172a;
  --deep: #1e293b;
  --panel-dark: #334155;
  --orange: #ee4d2d;
  --orange-dark: #d73211;
  --orange-soft: #fff1eb;
  --amber: #ff8a3d;
  --gold: #ffd166;
  --green: #10b981;
  --red: #ef4444;
  --pink: #f472b6;
  --purple: #8b5cf6;
  --gray: #e2e8f0;
  --yellow: #facc15;
  --blue: #2563eb;
  --teal: #0f766e;
  --cyan: #06b6d4;
  --white: #ffffff;
  --text: #111827;
  --muted: #64748b;
  --line: #cbd5e1;
  --shadow: 0 18px 38px rgba(15, 23, 42, .2);
  --shadow-soft: 0 10px 28px rgba(15, 23, 42, .09);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
}

body {
  margin: 0;
  font-family: Inter, Sarabun, Arial, 'Noto Sans Thai', sans-serif;
  background:
    radial-gradient(circle at top left, rgba(238, 77, 45, .12), rgba(255, 255, 255, 0) 32%),
    radial-gradient(circle at top right, rgba(15, 23, 42, .09), rgba(255, 255, 255, 0) 36%),
    linear-gradient(180deg, #fff7f2, #eef2f7);
  color: var(--text);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  white-space: nowrap;
}

input,
select,
textarea {
  width: 100%;
  min-width: 0;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  padding: 11px 12px;
  background: #f8fafc;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(238, 77, 45, .16);
}

.app-shell {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  flex: 0 0 280px;
  width: 280px;
  height: 100vh;
  overflow-y: auto;
  padding: 22px;
  background:
    linear-gradient(180deg, #0f172a, #172033 48%, #ee4d2d),
    #0f172a;
  color: #fff;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}

.brand-mark {
  display: grid;
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  place-items: center;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 12px 28px rgba(15, 23, 42, .24);
  color: var(--orange);
  font-weight: 900;
}

.brand h1 {
  margin: 0;
  font-size: 20px;
}

.brand p {
  margin: 2px 0 0;
  color: rgba(255, 255, 255, .78);
  font-size: 12px;
}

.nav-btn {
  width: 100%;
  margin: 7px 0;
  border: 0;
  border-radius: 16px;
  padding: 15px 16px;
  background: rgba(255, 255, 255, .14);
  color: rgba(255, 255, 255, .88);
  cursor: pointer;
  font-size: 15px;
  font-weight: 850;
  text-align: left;
  transition: transform .16s ease, background .16s ease, color .16s ease;
}

.nav-btn:hover,
.nav-btn.active {
  background: #fff;
  color: var(--orange-dark);
  transform: translateX(3px);
}

.sidebar-card {
  margin-top: 28px;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 18px;
  padding: 16px;
  background: rgba(255, 255, 255, .16);
  backdrop-filter: blur(10px);
}

.label,
.eyebrow {
  margin: 0 0 8px;
  color: #64748b;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.main {
  flex: 1;
  min-width: 0;
  overflow: auto;
  padding: 22px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
  border: 1px solid rgba(148, 163, 184, .28);
  border-radius: 18px;
  padding: 20px 22px;
  background: #ffffff;
  box-shadow: var(--shadow-soft);
}

.topbar h2 {
  margin: 0;
  font-size: 26px;
  line-height: 1.2;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: min(420px, 48%);
}

.primary,
.ghost {
  border: 0;
  border-radius: 11px;
  padding: 11px 16px;
  cursor: pointer;
  font-weight: 800;
}

.primary {
  background: linear-gradient(135deg, #ee4d2d, #ff8a3d);
  color: #fff;
  box-shadow: 0 10px 18px rgba(238, 77, 45, .22);
}

.ghost {
  background: #fff1eb;
  color: #9a3412;
}

.full {
  width: 100%;
  margin-top: 10px;
}

.view {
  display: none;
}

.active-view {
  display: block;
}

.loading {
  margin-bottom: 16px;
  border-radius: 18px;
  padding: 24px;
  background: #fff;
  box-shadow: var(--shadow-soft);
}

.deck-cover {
  position: relative;
  display: grid;
  grid-template-columns: minmax(280px, 1.1fr) minmax(320px, .9fr);
  gap: 18px;
  min-height: 260px;
  margin-bottom: 16px;
  overflow: hidden;
  border-radius: 22px;
  padding: 34px;
  background:
    radial-gradient(circle at 78% 16%, rgba(238, 77, 45, .72), rgba(238, 77, 45, 0) 27%),
    linear-gradient(135deg, rgba(15, 23, 42, .99), rgba(30, 41, 59, .96) 56%, rgba(238, 77, 45, .88)),
    #0f172a;
  color: #fff;
  box-shadow: var(--shadow);
}

.deck-cover::after {
  content: "";
  position: absolute;
  right: -110px;
  bottom: -140px;
  width: 390px;
  height: 390px;
  border: 48px solid rgba(148, 163, 184, .18);
  border-radius: 50%;
}

.deck-title {
  position: relative;
  z-index: 1;
  display: flex;
  max-width: 620px;
  flex-direction: column;
  justify-content: center;
}

.deck-title .eyebrow {
  color: rgba(255, 255, 255, .82);
}

.deck-title h3 {
  margin: 2px 0 10px;
  font-size: 48px;
  line-height: .98;
  letter-spacing: 0;
}

.deck-visual {
  position: relative;
  z-index: 1;
  min-height: 210px;
}

.deck-ring {
  position: absolute;
  right: 18px;
  top: 0;
  width: 220px;
  height: 220px;
  border: 28px solid rgba(255, 255, 255, .18);
  border-right-color: rgba(238, 77, 45, .92);
  border-bottom-color: rgba(255, 138, 61, .72);
  border-radius: 50%;
  box-shadow: inset 0 0 0 18px rgba(15, 23, 42, .18);
  animation: ringSpin 13s linear infinite;
}

.deck-pulse {
  position: absolute;
  width: 54px;
  height: 54px;
  border-radius: 16px;
  background: rgba(255, 255, 255, .95);
  box-shadow: 0 16px 34px rgba(15, 23, 42, .24);
  animation: nodeFloat 4.8s ease-in-out infinite;
}

.deck-pulse::after {
  content: "";
  position: absolute;
  inset: 15px;
  border-radius: 50%;
  background: var(--orange);
}

.deck-pulse-a { right: 252px; top: 42px; }
.deck-pulse-b { right: 102px; top: 176px; animation-delay: .8s; }
.deck-pulse-c { right: 306px; top: 168px; animation-delay: 1.4s; }

.deck-flow-card {
  position: absolute;
  right: 34px;
  bottom: 12px;
  width: min(300px, 86%);
  border: 1px solid rgba(255, 255, 255, .22);
  border-radius: 18px;
  padding: 18px;
  background: rgba(255, 255, 255, .94);
  color: #0f172a;
  box-shadow: 0 18px 36px rgba(15, 23, 42, .2);
  animation: cardFloat 5.8s ease-in-out infinite;
}

.deck-flow-card span {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 7px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 5px rgba(16, 185, 129, .18);
  animation: statusPulse 2.2s ease-in-out infinite;
}

.deck-flow-card strong,
.deck-flow-card small {
  display: block;
}

.deck-flow-card strong {
  margin-bottom: 4px;
  font-size: 18px;
}

.deck-flow-card small {
  color: #475569;
  font-weight: 800;
}

.route-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 6px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 5px rgba(16, 185, 129, .18);
}

.route-line {
  position: absolute;
  right: 40px;
  bottom: 36px;
  width: 78%;
  height: 74px;
  border-right: 4px solid rgba(255, 255, 255, .7);
  border-bottom: 4px solid rgba(255, 255, 255, .7);
  border-radius: 0 0 42px 0;
}

.route-node {
  position: absolute;
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  border: 4px solid rgba(255, 255, 255, .72);
  border-radius: 14px;
  background: #fff;
  color: #1d4ed8;
  font-weight: 950;
  box-shadow: 0 14px 24px rgba(15, 23, 42, .18);
}

.node-a { left: 4%; bottom: 22px; }
.node-b { left: 31%; bottom: 22px; }
.node-c { left: 58%; bottom: 22px; }
.node-d { right: 20px; bottom: 22px; }

.page-heading {
  margin-bottom: 16px;
  border-radius: 18px;
  padding: 18px 22px;
  background: linear-gradient(90deg, #0f172a, #1e293b 64%, #ee4d2d);
  color: #fff;
}

.page-heading span {
  color: #c9d6db;
  font-size: 12px;
  font-weight: 800;
}

.page-heading h3 {
  margin: 4px 0 0;
  font-size: 24px;
  line-height: 1.2;
}

.page-heading.blue {
  background: linear-gradient(90deg, #0f172a, #1e293b 62%, #ee4d2d);
}

.page-heading.orange {
  background: linear-gradient(90deg, #0f172a, #334155);
}

.page-heading.green {
  background: linear-gradient(90deg, #0f766e, #10b981);
}

.page-heading.dark {
  background: linear-gradient(90deg, #020617, #1e293b 70%, #ee4d2d);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 16px;
}

.kpi-card {
  position: relative;
  min-width: 0;
  overflow: hidden;
  border: 1px solid rgba(148, 163, 184, .24);
  border-top: 0;
  border-radius: 20px;
  padding: 20px 20px 22px;
  background: #fff;
  box-shadow: var(--shadow-soft);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}

.kpi-card:hover {
  border-color: rgba(238, 77, 45, .34);
  box-shadow: 0 18px 34px rgba(15, 23, 42, .14);
  transform: translateY(-3px);
}

.kpi-card::before {
  content: "";
  display: block;
  width: 46px;
  height: 46px;
  margin-bottom: 18px;
  border-radius: 15px;
  background: linear-gradient(135deg, #ee4d2d, #ffb088);
  box-shadow: 0 10px 18px rgba(238, 77, 45, .2);
}

.kpi-card::after {
  content: "";
  position: absolute;
  right: -42px;
  top: -42px;
  width: 108px;
  height: 108px;
  border-radius: 30px;
  background: rgba(238, 77, 45, .09);
  transform: rotate(18deg);
}

.kpi-card:nth-child(2)::before { background: linear-gradient(135deg, #0f172a, #475569); }
.kpi-card:nth-child(3)::before { background: linear-gradient(135deg, #1e293b, #94a3b8); }
.kpi-card:nth-child(4)::before { background: linear-gradient(135deg, #10b981, #a7f3d0); }
.kpi-card:nth-child(5)::before { background: linear-gradient(135deg, #2563eb, #bfdbfe); }
.kpi-card:nth-child(6)::before { background: linear-gradient(135deg, #0f766e, #99f6e4); }
.kpi-card:nth-child(7)::before { background: linear-gradient(135deg, #64748b, #cbd5e1); }
.kpi-card:nth-child(8)::before { background: linear-gradient(135deg, #020617, #94a3b8); }

.kpi-card p {
  margin: 0;
  color: #64748b;
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
}

.kpi-card strong {
  display: block;
  margin-top: 10px;
  font-size: 52px;
  line-height: 1;
  letter-spacing: 0;
}

.kpi-card span,
.mini-card span {
  color: #74848a;
  font-weight: 700;
}

.panel-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(300px, 1fr));
  gap: 16px;
}

.panel {
  min-width: 0;
  border: 1px solid rgba(148, 163, 184, .24);
  border-radius: 18px;
  padding: 18px;
  background: #fff;
  box-shadow: var(--shadow-soft);
}

.panel h4 {
  margin: 0 0 12px;
  font-size: 18px;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid #e2e8f0;
  padding: 11px 0;
}

.summary-label {
  flex: 1;
  min-width: 0;
}

.summary-label .pill {
  justify-content: flex-start;
  min-width: 0;
  max-width: 100%;
}

.summary-count {
  display: inline-grid;
  min-width: 52px;
  min-height: 42px;
  place-items: center;
  border: 1px solid rgba(238, 77, 45, .18);
  border-radius: 14px;
  background: linear-gradient(135deg, #fff7ed, #ffffff);
  color: #0f172a;
  font-size: 24px;
  font-weight: 950;
  box-shadow: 0 10px 20px rgba(15, 23, 42, .06);
}

.mini-kpi {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 14px;
}

.mini-card {
  min-width: 155px;
  border: 1px solid rgba(148, 163, 184, .24);
  border-radius: 16px;
  padding: 14px 18px;
  background: #fff;
  box-shadow: var(--shadow-soft);
}

.mini-card p {
  margin: 0 0 6px;
  color: #64748b;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
}

.mini-card strong {
  font-size: 28px;
  line-height: 1;
}

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  border: 1px solid rgba(148, 163, 184, .24);
  border-radius: 16px;
  padding: 14px;
  background: #fff;
  box-shadow: var(--shadow-soft);
}

.table-wrap {
  max-width: 100%;
  max-height: 68vh;
  overflow: auto;
  border: 1px solid rgba(148, 163, 184, .24);
  border-radius: 16px;
  background: #fff;
  box-shadow: var(--shadow-soft);
}

.table-wrap.big {
  max-height: 72vh;
}

table {
  width: 100%;
  min-width: 1040px;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}

#dbTable {
  min-width: 1500px;
}

th {
  position: sticky;
  top: 0;
  z-index: 2;
  border-right: 1px solid rgba(255, 255, 255, .18);
  padding: 13px 10px;
  background: #0f172a;
  color: #fff;
  text-align: center;
}

td {
  max-width: 240px;
  border-right: 1px solid #e2e8f0;
  border-bottom: 1px solid #e2e8f0;
  padding: 10px;
  vertical-align: middle;
  text-align: center;
  overflow-wrap: anywhere;
}

tr:hover td {
  background: #f8fafc;
}

.daily-cell {
  min-width: 220px;
  background: #f1f5f9;
  font-weight: 700;
  text-align: left;
}

.week-cell,
.year-cell {
  min-width: 64px;
  background: #ee4d2d;
  color: #fff;
  font-weight: 900;
}

.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  max-width: 100%;
  min-width: 74px;
  border-radius: 999px;
  padding: 5px 12px;
  font-weight: 800;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.pill.pending { background: #f1f5f9; color: #475569; }
.pill.passed,
.pill.pass,
.pill.done { background: #d1fae5; color: #047857; }
.pill.landlord { background: #dbeafe; color: #1d4ed8; }
.pill.discussion { background: #ede9fe; color: #6d28d9; }
.pill.fieldcheck { background: #e0f2fe; color: #0369a1; }
.pill.negotiation { background: #fef3c7; color: #92400e; }
.pill.lead { background: #fce7f3; color: #be185d; }
.pill.propose { background: #ffedd5; color: #c2410c; }
.pill.emailopen { background: #cffafe; color: #0e7490; }
.pill.approved { background: #dcfce7; color: #15803d; }
.pill.operational { background: #10b981; color: #ffffff; }
.pill.failed,
.pill.bad { background: #fee2e2; color: #b91c1c; }
.pill.revision { background: #fef9c3; color: #a16207; }
.pill.modelchange { background: #f3e8ff; color: #7e22ce; }
.pill.acquisition { background: #dbeafe; color: #1d4ed8; }
.pill.outreach { background: #ffedd5; color: #c2410c; }
.pill.blue { background: #dbeafe; color: #1d4ed8; }
.pill.darkgreen { background: #10b981; color: #fff; }
.pill.purple { background: #f3e8ff; color: #7e22ce; }
.pic { background: #f3f4f6; color: #374151; }
.pic.oil,
.pic.jet { background: #fee2e2; color: #b91c1c; }
.pic.tum { background: #ccfbf1; color: #0f766e; }
.pic.ball { background: #fef3c7; color: #92400e; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(0, 0, 0, .45);
}

.modal-backdrop.open {
  display: flex;
}

.modal {
  width: min(850px, 96vw);
  max-height: 92vh;
  overflow: auto;
  border-radius: 24px;
  background: #fff;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid #e7edf0;
  padding: 22px;
}

.modal-header h3 {
  margin: 0;
  font-size: 24px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border: 0;
  border-radius: 50%;
  background: #eef4f5;
  cursor: pointer;
  font-size: 26px;
  line-height: 1;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(240px, 1fr));
  gap: 14px;
  padding: 22px;
}

.form-grid label {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 7px;
  color: #34444a;
  font-weight: 800;
}

.span-2 {
  grid-column: span 2;
}

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

.toast {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 80;
  max-width: min(420px, calc(100vw - 44px));
  border-radius: 14px;
  padding: 14px 18px;
  background: #061015;
  color: #fff;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(12px);
  transition: .2s;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.muted {
  margin: 0;
  color: var(--muted);
}

@keyframes ringSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes nodeFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

@keyframes cardFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

@keyframes statusPulse {
  0%, 100% { box-shadow: 0 0 0 5px rgba(16, 185, 129, .18); }
  50% { box-shadow: 0 0 0 9px rgba(16, 185, 129, .08); }
}

@media (max-width: 1180px) {
  .kpi-grid {
    grid-template-columns: repeat(2, minmax(160px, 1fr));
  }
}

@media (max-width: 980px) {
  .deck-cover {
    grid-template-columns: 1fr;
    padding: 22px;
  }

  .deck-title h3 {
    font-size: 38px;
  }

  .deck-visual {
    min-height: 250px;
  }

  .app-shell {
    display: block;
  }

  .sidebar {
    position: relative;
    width: 100%;
    height: auto;
    max-height: none;
  }

  .main {
    padding: 14px;
  }

  .topbar {
    display: block;
  }

  .top-actions {
    flex-wrap: wrap;
    min-width: 0;
    margin-top: 12px;
  }

  .top-actions .primary {
    width: 100%;
  }

  .kpi-grid,
  .panel-grid {
    grid-template-columns: 1fr;
  }

  .toolbar {
    flex-wrap: wrap;
  }

  .toolbar > * {
    flex: 1 1 180px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .span-2 {
    grid-column: span 1;
  }
}

@media (max-width: 560px) {
  .deck-cover {
    min-height: 0;
    padding: 18px;
  }

  .deck-title h3 {
    font-size: 31px;
  }

  .deck-visual {
    min-height: 230px;
  }

  .deck-ring {
    right: -10px;
